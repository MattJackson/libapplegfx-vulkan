name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All jobs are named explicitly so GitHub's status check list shows per-job results.
# Keep workflow name = `ci.yml` (referenced by repo status badge in README).

jobs:
  # -------------------------------------------------------------------------
  # Linux (Ubuntu / glibc) — meson setup + compile + full test suite.
  # This is the reference platform for local dev and the CI "happy path".
  # Expected: 7/7 tests pass (validated 2026-04-20 on portainer-1 Alpine; the
  # Ubuntu and Alpine jobs should agree — any divergence is a glibc-vs-musl bug).
  # -------------------------------------------------------------------------
  linux-meson:
    name: meson (ubuntu-latest, glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-meson-v1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-meson-v1-

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libvulkan-dev vulkan-headers mesa-vulkan-drivers \
            vulkan-tools glslang-tools \
            clang

      - name: Verify Vulkan toolchain
        # Hard-fail if the apt install above did not yield a usable Vulkan
        # pkg-config + loadable ICD. Without this the meson setup below
        # silently falls back to the no-op stub path and every vulkan-*
        # test SKIPs — which is exactly the M1 validation gap we're here
        # to close.
        run: |
          set -e
          echo "--- pkg-config vulkan ---"
          pkg-config --modversion vulkan
          pkg-config --cflags --libs vulkan
          echo "--- loadable ICDs ---"
          ls -1 /usr/share/vulkan/icd.d/ || true
          echo "--- vulkaninfo --summary ---"
          vulkaninfo --summary | head -40

      - name: Configure
        run: meson setup build

      - name: Assert Vulkan detected by meson
        # meson.build prints "Vulkan found — building real Vulkan init
        # path" on success. If we fall through to the warning branch the
        # vulkan-* tests will SKIP at configure time (they're gated on
        # vulkan_dep.found()). Grep the meson log and hard-fail if the
        # real path wasn't taken.
        run: |
          set -e
          if grep -q "Vulkan not found" build/meson-logs/meson-log.txt; then
            echo "::error::meson did not detect Vulkan — vulkan-* tests will SKIP"
            grep -E "vulkan|Vulkan" build/meson-logs/meson-log.txt || true
            exit 1
          fi
          grep -q "Vulkan found" build/meson-logs/meson-log.txt

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Assert vulkan-* tests actually ran
        # meson test registers the vulkan-init / vulkan-command /
        # vulkan-render / translate-render tests at configure time when
        # vulkan_dep was present. We additionally require them to have
        # exit-0 status in the testlog — a SKIP or test-internal bail-out
        # would mean either the ICD isn't loading or the test self-skipped
        # on first vkEnum call, both of which are exactly what M1 needed
        # to catch. meson writes a multi-line block per test:
        #   test:         libapplegfx-vulkan:<name>
        #   ...
        #   result:       exit status 0
        # so we python-parse that structure rather than trying to awk it.
        run: |
          set -e
          log=build/meson-logs/testlog.txt
          [ -f "$log" ] || { echo "::error::no testlog"; exit 1; }
          python3 - "$log" <<'PY'
          import re, sys
          log = open(sys.argv[1]).read()
          required = [
              "vulkan init",
              "vulkan command",
              "vulkan render",
              "translate render",
          ]
          # Split on the "===== N/M =====" separators that meson uses.
          blocks = re.split(r"={10,}\s+\d+/\d+\s+={10,}", log)
          # name -> (exit_status_line, body)
          info = {}
          for b in blocks:
              m = re.search(r"test:\s+[^:\s]+:([^\n]+)", b)
              r = re.search(r"result:\s+([^\n]+)", b)
              if m and r:
                  info[m.group(1).strip()] = (r.group(1).strip(), b)
          problems = []
          for name in required:
              entry = info.get(name)
              if entry is None:
                  problems.append(f"{name}: NOT REGISTERED — Vulkan dep missing at configure time")
                  continue
              status, body = entry
              if status != "exit status 0":
                  problems.append(f"{name}: {status}")
                  continue
              # Test returned 0 but may have internally self-skipped after
              # failing to find a loadable ICD. Count SKIP vs PASS lines in
              # its stdout; if it's pure-SKIP or majority-SKIP we flag it.
              skip_count = len(re.findall(r"^SKIP:", body, re.M))
              pass_count = len(re.findall(r"^PASS:", body, re.M))
              if pass_count == 0 and skip_count > 0:
                  problems.append(
                      f"{name}: exit 0 but 0 PASS + {skip_count} SKIP — "
                      "test self-skipped (likely no loadable ICD at runtime)"
                  )
          if problems:
              print("::error::required vulkan-* tests did not actually execute:")
              for p in problems:
                  print(f"  - {p}")
              print("\nAll registered test results:")
              for k, (s, _) in info.items():
                  print(f"  {k}: {s}")
              sys.exit(1)
          print("All required vulkan-* tests executed and passed:")
          for name in required:
              s, body = info[name]
              pc = len(re.findall(r"^PASS:", body, re.M))
              sc = len(re.findall(r"^SKIP:", body, re.M))
              print(f"  {name}: {s} ({pc} PASS, {sc} SKIP)")
          PY

      - name: Upload testlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-linux
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Alpine 3.21 (musl) — same build as above but on the production container
  # base image. Catches portability regressions (musl vs glibc: memfd_create
  # ABI, pthread tunables, locale) before they bite in docker-macos.
  # Runs inside a container so we get a real Alpine userland.
  # -------------------------------------------------------------------------
  alpine-meson:
    name: meson (alpine:3.21, musl)
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - uses: actions/checkout@v4

      - name: Cache apk packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apk
          key: apk-alpine321-meson-v1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apk-alpine321-meson-v1-

      - name: Install build deps
        # vulkan-loader-dev ships /usr/lib/pkgconfig/vulkan.pc (the
        # piece meson needs to set vulkan_dep.found() = true).
        # mesa-vulkan-swrast ships the lavapipe ICD JSON at
        # /usr/share/vulkan/icd.d/lvp_icd.x86_64.json (the piece the
        # loader needs at runtime to actually hand out a VkInstance).
        # glslang + glslang-dev give us glslangValidator (used by
        # air2spirv fixtures and any future shader compile tests).
        # vulkan-tools provides `vulkaninfo` for the verification step
        # below — without that we can't cheaply prove the toolchain
        # actually works before running meson.
        run: |
          apk add --no-cache \
            build-base meson ninja pkgconf \
            vulkan-loader-dev vulkan-headers vulkan-tools \
            mesa-vulkan-swrast \
            glslang glslang-dev \
            git bash python3

      - name: Verify Vulkan toolchain
        # Hard-fail if the apk install above did not yield a usable
        # Vulkan pkg-config + loadable ICD. Mirrors the linux-meson job
        # so Alpine (production container base) and Ubuntu are held to
        # the same standard.
        run: |
          set -e
          echo "--- pkg-config vulkan ---"
          pkg-config --modversion vulkan
          pkg-config --cflags --libs vulkan
          echo "--- loadable ICDs ---"
          ls -1 /usr/share/vulkan/icd.d/
          echo "--- vulkaninfo --summary ---"
          vulkaninfo --summary | head -40

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: meson setup build

      - name: Assert Vulkan detected by meson
        run: |
          set -e
          if grep -q "Vulkan not found" build/meson-logs/meson-log.txt; then
            echo "::error::meson did not detect Vulkan on Alpine — vulkan-* tests will SKIP"
            grep -E "vulkan|Vulkan" build/meson-logs/meson-log.txt || true
            exit 1
          fi
          grep -q "Vulkan found" build/meson-logs/meson-log.txt

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Assert vulkan-* tests actually ran
        # Same strict parser as the linux-meson job — requires exit 0 AND
        # non-zero PASS-line count in each required test's stdout block.
        run: |
          set -e
          log=build/meson-logs/testlog.txt
          [ -f "$log" ] || { echo "::error::no testlog"; exit 1; }
          python3 - "$log" <<'PY'
          import re, sys
          log = open(sys.argv[1]).read()
          required = ["vulkan init", "vulkan command", "vulkan render", "translate render"]
          blocks = re.split(r"={10,}\s+\d+/\d+\s+={10,}", log)
          info = {}
          for b in blocks:
              m = re.search(r"test:\s+[^:\s]+:([^\n]+)", b)
              r = re.search(r"result:\s+([^\n]+)", b)
              if m and r:
                  info[m.group(1).strip()] = (r.group(1).strip(), b)
          problems = []
          for name in required:
              entry = info.get(name)
              if entry is None:
                  problems.append(f"{name}: NOT REGISTERED — Vulkan dep missing at configure time")
                  continue
              status, body = entry
              if status != "exit status 0":
                  problems.append(f"{name}: {status}")
                  continue
              pc = len(re.findall(r"^PASS:", body, re.M))
              sc = len(re.findall(r"^SKIP:", body, re.M))
              if pc == 0 and sc > 0:
                  problems.append(f"{name}: exit 0 but 0 PASS + {sc} SKIP — self-skipped (no loadable ICD)")
          if problems:
              print("::error::required vulkan-* tests did not actually execute:")
              for p in problems: print(f"  - {p}")
              sys.exit(1)
          print("All required vulkan-* tests executed and passed:")
          for name in required:
              s, body = info[name]
              pc = len(re.findall(r"^PASS:", body, re.M))
              sc = len(re.findall(r"^SKIP:", body, re.M))
              print(f"  {name}: {s} ({pc} PASS, {sc} SKIP)")
          PY

      - name: Upload testlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-alpine
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Darwin — meson build on macOS. Confirms the library builds and tests pass
  # on the host dev platform (libapplegfx-vulkan is a Linux-first library but
  # the header-syntax / memory-task / protocol-dispatch tests must remain
  # host-portable so contributors can iterate on Apple hardware).
  # Expected: 7/7 tests pass (validated locally 2026-04-20).
  # -------------------------------------------------------------------------
  darwin-meson:
    name: meson (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: brew-macos-meson-v1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            brew-macos-meson-v1-

      - name: Install build deps
        run: |
          brew update
          brew install meson ninja pkg-config

      - name: Configure
        # Vulkan loader is not present on stock macOS runners; meson.build
        # gracefully falls back to the stub init path (see meson.build §Deps).
        run: meson setup build

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Upload testlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-darwin
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Sanitizer job — Linux + clang + ASAN/UBSAN. Catches memory bugs (OOB,
  # use-after-free) and undefined behavior (signed overflow, null deref)
  # that the regular test run would miss. -Db_lundef=false is required for
  # meson+clang+asan to link shared libs correctly.
  # -------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (asan+ubsan, clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-sanitizers-v1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-sanitizers-v1-

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config clang \
            libvulkan-dev vulkan-headers mesa-vulkan-drivers \
            vulkan-tools glslang-tools

      - name: Verify Vulkan toolchain
        run: |
          set -e
          pkg-config --modversion vulkan
          ls -1 /usr/share/vulkan/icd.d/ || true

      - name: Configure with ASAN+UBSAN
        env:
          CC: clang
        run: meson setup build -Db_sanitize=address,undefined -Db_lundef=false

      - name: Compile
        run: meson compile -C build

      - name: Test
        env:
          # Fail on first UB finding instead of silently continuing.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: meson test -C build --print-errorlogs --timeout-multiplier 3

      - name: Upload testlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-sanitizers
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # clang-tidy — kept from pre-expansion CI. Does not fail the build yet
  # (|| true) because the codebase hasn't been fully tidied; flip to fail on
  # warnings once the backlog is cleared.
  # -------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy (public header)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-clangtidy-v1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-clangtidy-v1-

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy

      - name: Lint public header
        run: clang-tidy include/libapplegfx-vulkan.h -- -I include || true

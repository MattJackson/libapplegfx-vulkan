name: build-type matrix

# Extends ci.yml with an explicit debug/release matrix on ubuntu-24.04.
# ci.yml already covers ubuntu-latest + alpine + macos + sanitizers; this
# file narrowly adds per-buildtype coverage so release-only regressions
# (NDEBUG-gated asserts, -O2 UB) fail CI too. macOS rows can be added
# to the matrix once brew MoltenVK is wired.

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  meson:
    name: meson (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        # meson+ninja: build system. libvulkan-dev+vulkan-headers: pkg-config
        # vulkan for meson detection. vulkan-validationlayers: runtime
        # VK_LAYER_KHRONOS_validation. mesa-vulkan-swrast: lavapipe ICD so
        # tests hit a real VkInstance. glslang-tools: glslangValidator for
        # shader fixtures. spirv-tools: spirv-val for air2spirv. clang:
        # preferred compiler (matches sanitizers job).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config clang \
            libvulkan-dev vulkan-tools \
            vulkan-validationlayers mesa-vulkan-drivers \
            glslang-tools spirv-tools
      - name: Configure (${{ matrix.build_type }})
        run: meson setup build --buildtype=${{ matrix.build_type }}
      - name: Assert Vulkan detected by meson
        run: |
          set -e
          if grep -q "Vulkan not found" build/meson-logs/meson-log.txt; then
            echo "::error::meson did not detect Vulkan"; exit 1
          fi
          grep -q "Vulkan found" build/meson-logs/meson-log.txt
      - name: Build
        run: ninja -C build
      - name: Test
        run: ninja -C build test
      - name: Assert vulkan-* tests actually ran (not self-skipped)
        # Per feedback_validate_against_real_api.md: a green ninja test is
        # not enough — a test that exits 0 after "no ICD found, bailing"
        # would still pass. Require >=1 PASS line per vulkan test.
        run: |
          python3 - build/meson-logs/testlog.txt <<'PY'
          import re, sys
          log = open(sys.argv[1]).read()
          req = ["vulkan init", "vulkan command", "vulkan render", "translate render"]
          blocks = re.split(r"={10,}\s+\d+/\d+\s+={10,}", log)
          info = {}
          for b in blocks:
              m = re.search(r"test:\s+[^:\s]+:([^\n]+)", b)
              r = re.search(r"result:\s+([^\n]+)", b)
              if m and r: info[m.group(1).strip()] = (r.group(1).strip(), b)
          bad = []
          for n in req:
              e = info.get(n)
              if not e: bad.append(f"{n}: NOT REGISTERED"); continue
              s, body = e
              if s != "exit status 0": bad.append(f"{n}: {s}"); continue
              pc = len(re.findall(r"^PASS:", body, re.M))
              sc = len(re.findall(r"^SKIP:", body, re.M))
              if pc == 0 and sc > 0: bad.append(f"{n}: self-skipped ({sc} SKIP)")
          if bad:
              print("::error::vulkan-* tests did not really run:"); [print(" -",x) for x in bad]; sys.exit(1)
          print("OK: all required vulkan-* tests executed with >=1 PASS line")
          PY

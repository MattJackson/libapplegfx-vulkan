name: Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build vulkan-tools libvulkan-dev
          pip3 install vncdotool opencv-python-headless numpy
      
      - name: Setup build
        run: |
          meson setup builddir --wipe
          meson compile -C builddir
      
      - name: Run meson unit tests
        run: |
          meson test -C builddir --print-errorlogs
      
      - name: Run M5 deadlock detection
        run: |
          ./builddir/tests/m5-deadlock-detect
      
      - name: Run smoke test (headless)
        run: |
          # Mock guest check — verify tests exist and are runnable
          echo "Skipping full smoke test in CI (requires VM)"
          echo "Run locally with: SMOKE_GUEST=user@10.1.7.20 ./scripts/smoke-test.sh"

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          # This would require docker-in-docker setup
          echo "Integration tests run on separate runner with QEMU/KVM"
      
      - name: Deploy to test VM
        run: |
          # Deploy to test environment and run VNC automation
          echo "Deploy mos-docker-macos-1 and wait for SSH..."
          # ssh docker 'cd $HOME/mos-docker && sudo docker compose up -d macos'
      
      - name: Run Stage 10% validation
        run: |
          python3 tests/guest/vnc_automation.py \
            --vnc-host localhost \
            --timeout 180

  coverage-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run regression suite
        run: |
          REGRESSION_MODE=ci ./scripts/regression-run.sh
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            builddir/meson-logs/testlog.txt
            /tmp/regression-report.json
